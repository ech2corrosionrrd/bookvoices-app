# 2 ГБ не вистачало на Compose-компілятор і KSP разом: демон доходив до межі й
# витрачав помітну частку часу в GC замість компіляції.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Кеш збірки: повторний прогін тих самих тестів і компіляції не рахується вдруге.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Режим GPU для керованих пристроїв (генерація Baseline Profile).
# AGP 8.13 передає емулятору `-gpu auto-no-window`, але емулятор 37.x цей режим
# уже не приймає: він відкочується на `auto`, намагається відкрити вікно, AGP не
# дочікується завантаження й повторює спробу — а та впирається у власний же
# запущений процес («Another emulator instance is running»).
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
