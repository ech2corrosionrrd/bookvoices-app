[versions]
# Тулчейн на AGP 9 / Kotlin 2.4 / Gradle 9 — міграція, яку до 12 вересня 2026
# відкладали. Вона знімає стелю бібліотек: core-ktx 1.19, lifecycle 2.11,
# navigation 2.10, compose-bom 2026.09 і media3 1.11 вимагали саме її.
#
# Що змінилося в самих файлах збірки: плагін `org.jetbrains.kotlin.android`
# більше не потрібен (AGP 9 має вбудований Kotlin), `kotlinOptions` замінено на
# `kotlin { compilerOptions { … } }`, compileSdk піднято до 37. KSP відтепер має
# власну нумерацію, не привʼязану до версії Kotlin.
#
# Room свідомо лишається на 2.7.1: у 2.8 `room-testing` читає схеми через
# kotlinx-serialization новішої версії, ніж та, яку жорстко закріплює
# compose-bom (1.7.3), і всі одинадцять тестів міграцій падають з
# AbstractMethodError. Користі від 2.8 тут немає, а тести міграцій — найцінніший
# запобіжник у проєкті.
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"

composeBom = "2026.09.00"
coreKtx = "1.19.0"
appcompat = "1.8.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.1"
lifecycle = "2.11.0"
media3 = "1.11.1"
room = "2.7.1"
datastore = "1.2.1"
concurrentFutures = "1.3.0"
documentfile = "1.1.0"
work = "2.11.2"
benchmark = "1.5.0"
# Play з 31.08.2026 відхиляє оновлення на Billing < 8 (extension до 01.11.2026).
billing = "8.0.0"

# Хмарний клієнт (:cloudapp). supabase-kt 2.6 тримається ktor 2.x — версії
# зв'язані жорстко, тож міняти їх можна тільки разом.
supabase = "2.6.1"
ktor = "2.3.12"
# Приходить транзитивно з supabase-kt, але моделі каталогу використовують Instant
# напряму. Без явного оголошення оновлення supabase зламало б компіляцію без
# жодної підказки, звідки взялася залежність.
kotlinxDatetime = "0.6.0"
coil = "2.7.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

junit = "4.13.2"
json = "20260814"
coroutinesTest = "1.11.0"
robolectric = "4.17"
archCoreTesting = "2.2.0"
androidxTestJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

# Baseline Profile: профіль ставиться на пристрій цією бібліотекою, а генерується
# макробенчмарком у модулі :baselineprofile.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# --- хмарний клієнт --------------------------------------------------------
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-auth = { module = "io.github.jan-tennert.supabase:gotrue-kt" }
supabase-functions = { module = "io.github.jan-tennert.supabase:functions-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
