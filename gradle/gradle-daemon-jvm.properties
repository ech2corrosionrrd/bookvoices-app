# Демон Gradle працює на JDK 17 — тій самій версії, що compileOptions/jvmTarget і CI.
# Вендор навмисно не вказаний: раніше тут стояв toolchainVendor=jetbrains, і на CI
# такого JVM просто немає. Без цього файла демон бере JAVA_HOME, а JBR з Android Studio
# уже 25 — AGP 8.13 на ній не запускається.
toolchainVersion=17
