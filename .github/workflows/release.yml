name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Відновити ключ підпису
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/bookvoices.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/bookvoices.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Тести й lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Зібрати APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PreleaseTag=${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Перевірити підпис
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fi
          echo "--- app-release.apk"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Перейменувати артефакти
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/bookvoices-${VER}.apk"
          cp app/build/outputs/mapping/release/mapping.txt \
             "dist/mapping-bookvoices-${VER}.txt" || true
          ls -la dist

      - name: Створити реліз
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ${{ steps.keystore.outputs.signed == 'true'
                && 'APK підписаний релізним ключем.'
                || '⚠️ APK НЕ підписаний: у репозиторії немає секретів ключа.' }}

            **bookvoices-*.apk** — локальний офлайн-плеєр аудіокниг.

      - name: Зберегти mapping.txt
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: dist/mapping-*.txt
          retention-days: 90
