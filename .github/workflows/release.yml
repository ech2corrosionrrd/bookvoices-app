name: Release build check

# Підписані APK у Releases цього репозиторію викладаються з ПК власника
# (scripts/publish-mirror-release.ps1 у приватному репо): ключ підпису — він же ключ
# підписання застосунку в Google Play — свідомо не зберігається в секретах публічного
# репозиторію, де працюють сторонні Actions.
#
# Тут лише перевірка, що код на тегу збирається на чистому Linux в обох варіантах
# (так само збирав би F-Droid). Нічого не підписує і реліз не створює.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Тести й lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Play-варіант (непідписаний)
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PreleaseTag=${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: FOSS-варіант (непідписаний, без Play Billing)
        run: >
          ./gradlew :app:assembleRelease -Pfoss=true --no-daemon
          -PreleaseTag=${{ github.ref_type == 'tag' && github.ref_name || '' }}
