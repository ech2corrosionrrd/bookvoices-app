name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Mirror may be synced from Windows; ensure gradlew is executable on the runner.
      - name: chmod gradlew
        run: chmod +x gradlew

      - name: devVersion випереджає останній тег
        run: |
          dev=$(grep -o 'val devVersion = "[0-9.]*' build.gradle.kts | grep -o '[0-9][0-9.]*')
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          last=${last#v}
          if [ -z "$dev" ]; then
            echo "::error::devVersion не знайдено в build.gradle.kts"
            exit 1
          fi
          if [ -z "$last" ]; then
            echo "Тегів ще немає — звіряти нема з чим (devVersion=$dev)."
            exit 0
          fi
          newest=$( { echo "$dev"; echo "$last"; } | sort -V | tail -1 )
          echo "devVersion=$dev, останній тег=v$last"
          if [ "$dev" = "$last" ] || [ "$newest" != "$dev" ]; then
            echo "::error::devVersion ($dev) не випереджає випущену версію ($last). Підніміть його в build.gradle.kts."
            exit 1
          fi

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Звіти
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: mapping.txt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 35]
    steps:
      - uses: actions/checkout@v7

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Апаратне прискорення KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Звільнити місце на диску
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Інструментальні тести на емуляторі
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Звіти емулятора
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-instrumented-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
